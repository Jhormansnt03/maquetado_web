<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parrafos y encabezados</title>
</head>
<body>
    <!-- titulos o encabezados:
    se tienen 6 tipos de encabezados, desde el h1 hasta el h6. -->
    <!-- (h$*6) crea 6 titulos en orden del 1 al 6 Emmet-->
        <h1>titulo 1</h1>
        <!-- El h1 se utiliza una sola vez por pagina web esto es debido a que el h1 tiene una importancia en el CEO lo que es el posicionamiento web, es decir, google le da mucha importancia al h1 -->
        <h2>subtitulo 2</h2>
        <h3>subtitulo 3</h3>
        <h4>subtitulo 4</h4>
        <h5>subtitulo 5</h5>
        <h6>subtitulo 6</h6>
        <!-- desde el h2 hasta el h6, se puede utilizar la veces que sean necesarias segun el contenido que se quiera recrear  -->
        

        <!-- Parrafos: Los parrafos deben tener una idea o punto especifico.
        Cada parrafo escrito debe de contener un concepto, una idea. Es decir, pude describir una seccion o un elemento, hasta un mensaje en el chat. Por ejemplo en una seccion se habla de los beneficios del ejercicio:
        Un parrafo puede tratar de mejorar la salud cardiovascular y otro puede ser sobre los beneficios y los cuidados de la salud mental. Finalmente, debe de existir un motivo para que exista un parrafo. -->
        <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Ex, velit. Pariatur error odio ea, qui modi unde porro aliquid suscipit, aperiam atque consequuntur. Repellendus doloribus quisquam, odit iusto delectus mollitia?
        </p>
        <!-- (CTRL+SHIFT+P) o (ALT+Z) Ajusta el contenido del parrafo a la ventana del editor -->
        <!-- existen algunas tecnologias de asistencia como lectores de pantalla, que ayudan a las personas con discapacidad visual a navegar por el contenido web.
        por ejemplo: cuando estas tecnologias leen el h1 de la pagina, entienden de que trata la pagina por el h1. Por temas de accesibilidad web es importante que se utilice el h1 solo una vez por pagina. -->
</body>
</html>
