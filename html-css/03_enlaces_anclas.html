<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlaces</title>
</head>
<body>
    <!-- los enlaces o anclas o hipervinculos -->
    <!-- a (anchor) significa ancla. metafora: como un barco te mantiene en una ubicacion especifica un ancla es justamente para que el usuario sepa hacia donde buscar un recurso o hacia donde navegar en la pagina web. -->

    <!-- los atributos son carcteristicas que definen el comportamiento y la apariencia de los elementos en este caso el tributo href vuelve funcional a la etiqueta es por esta razon que se utiliza en el maquetado y no en el css dado que no es una caracteristica visual. -->

    <!-- href (hyper reference) es la referencia a un recurso, es decir el destino del enlace -->
    <!-- lo que esta dentro de la etiqueta a es el texto visible que el usuario verá en la página web. mientras que lo que esta dentro de href es la referencia al recurso al que apunta el enlace -->
    <h2 title="titulo de la pagina">Enlaces o Anclas</h2>
    <!-- por otra parte, el atributo title proporciona un texto de ayuda que se muestra cuando el usuario pasa el mouse sobre el enlace. Las tecnologias de asistencia como lectores de pantalla utilizan este atributo para proporcionar información adicional a los usuarios. en el caso de personas invidentes esto les permite acceder a informacion adicional sobre el enlace. -->

    <a href="https://www.google.com">Google</a>
    <br>
    <a href="https://www.facebook.com">Facebook</a>
    <br>
    <a href="https://www.youtube.com">Youtube</a>
    <br>
    <a title="ir al canal de youtube" href="https://www.youtube.com/@ramcrack0584">Ramcrak</a> <!-- mala practica: usar el potocolo relativo sin especificar el protocolo -->
    <br>
    <br>
    <a href="03-1_pagina_enlace1.html">ir a enlace uno</a>
    <br>
    <a href="03-2_pagina_enlace2.html">ir a enlace dos</a>
    <br>
    <a href="03-3_pagina_enlace3.html">ir a enlace tres</a>
    <!-- es sumamente importante que en la programacion y el desarrollo web se realicen practicas a medidas que se va avanzando, de esta forma se asegura una mejor comprencion y aplicacion de los conceptos aprendidos. Entiendn que la programacion es un proceso activo no pasivo, una cosa es intentar comprender lo que suceden cuando leen o ven algo que se esta haciendo, sin embargo, la unica forma de aprender es probando ustedes mismos todo lo que se debe implementar -->
    <br>

    <h2>enlaces con target a otra ventana</h2>
    <a href="03-4_pagina_enlace4.html" target="_blank">ir a enlace cuatro en una nueva ventana</a>
    <!-- El atributo target="_blank" abre el enlace en una nueva ventana o pestaña del navegador. Por defecto siempre esta en self que significa que se abre en la misma ventana -->
</body>
</html>
