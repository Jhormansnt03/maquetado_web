<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagenes</title>
</head>
<body>
    <!-- etiquetas de bloque y etiquetas de linea -->
    <h1>Imagenes</h1>
    <!-- las imagenes se insertan en html usando la etiqueta img. esta etiqueta es un elemento vacio, lo que significa que no tiene una etiqueta de cierre. La sintaxis basica para insertar una imagen es:-->
    
    <!-- vale la pena recordar que el atributo title proporciona un tooltip que se muestra cuando el usuario pasa el mouse sobre la imagen. -->
    <img src="bicho.jpg" alt="foto del bicho" title="Bichoooooo" width="200" height="200">
    <!-- para que los lectors de pantalla sepan de que se trata la imagen el atributo alt (alternative text) es muy importante puesto que proporciona una descripción textual de la imagen para accesibilidad y como fallback si no se carga. El texto alternativo debe ser descriptivo y conciso, y debe transmitir la misma información esencial que la imagen representa. por ejemplo si la imagen es el logotipo de una empresa, el texto alternativo podría ser "Logotipo de la empresa xyz" si la imagen es la fotografia de un paisaje, el texto alternativo podría ser "Fotografia de un paisaje con montañas y un lago" . En resumen, el atributo alt proporciona una descripcion de la imagen en caso de que no se pueda cargar.-->
    
    <!-- self closing tags son etiquetas que se autocierran -->


    
</body>
</html>
